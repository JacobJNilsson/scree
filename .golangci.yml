version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unused
    - gocritic
    - bodyclose
    - noctx
    - revive
    - unparam
  settings:
    govet:
      disable:
        - fieldalignment
  exclusions:
    paths:
      # Fixture modules contain bad code on purpose, for the metrics to find.
      - "(^|/)testdata/"

formatters:
  enable:
    - gofmt
    - goimports
