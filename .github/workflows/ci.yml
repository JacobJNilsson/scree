name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: make check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The pin keeps CI on the linter version that the workstations run.
      - name: Install golangci-lint
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.10.1

      # CI runs make check unchanged, so the Makefile alone defines a passing build.
      - name: Run the gate
        run: make check
